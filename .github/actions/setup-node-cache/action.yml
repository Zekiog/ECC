name: 'Setup Node.js with cache'
description: 'Sets up Node.js with automatic package manager cache. Fail-safe — no-op if no lockfile.'
inputs:
  node-version:
    description: 'Node.js version (e.g., 20.x, 22.x)'
    required: false
    default: '20.x'
  cache:
    description: 'Override cache package manager (npm, pnpm, yarn, bun)'
    required: false
    default: ''
  cache-dependency-path:
    description: 'Path to lockfile(s) for cache key'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Detect package manager
      id: pm
      shell: bash
      run: |
        if [ -n "${{ inputs.cache }}" ]; then
          echo "manager=${{ inputs.cache }}" >> "$GITHUB_OUTPUT"
        elif [ -f "pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> "$GITHUB_OUTPUT"
        elif [ -f "yarn.lock" ]; then
          echo "manager=yarn" >> "$GITHUB_OUTPUT"
        elif [ -f "bun.lockb" ]; then
          echo "manager=bun" >> "$GITHUB_OUTPUT"
        else
          echo "manager=npm" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      if: steps.pm.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 9

    - name: Setup Bun
      if: steps.pm.outputs.manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

    - name: Cache dependencies
      if: steps.pm.outputs.manager != 'none'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.3.0
      with:
        path: |
          node_modules
          ~/.npm
          ~/.pnpm-store
          ~/.bun/install/cache
          ~/.cache/yarn
        key: ${{ runner.os }}-${{ steps.pm.outputs.manager }}-${{ inputs.cache-dependency-path || hashFiles(format('**/{0}{1}', steps.pm.outputs.manager == 'npm' && 'package-lock.json' || steps.pm.outputs.manager == 'pnpm' && 'pnpm-lock.yaml' || steps.pm.outputs.manager == 'yarn' && 'yarn.lock' || steps.pm.outputs.manager == 'bun' && 'bun.lockb' || 'package-lock.json', '**/package-lock.json')) }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.pm.outputs.manager }}-
