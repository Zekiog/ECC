name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # This workflow only triggers on pull_request_target, so `github.event_name`
  # is always `pull_request_target` (never `pull_request`). A conditional
  # against the wrong event name silently leaves cancel-in-progress false.
  # Cancel-in-progress is unconditionally true here because there are no other
  # triggers to protect (no release/push/schedule).
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge patch/minor Dependabot PRs
    runs-on: ubuntu-latest
    # gh pr checks --watch waits up to 30 minutes for status checks to
    # complete. Job timeout must exceed that, with margin for the
    # subsequent mergeStateStatus check + auto-merge call.
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write

    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false

    steps:
      - name: Checkout base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Reject if any dependency bump is major
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Dependabot PR bodies include lines like:
          #   "Bumps [pkg](url) from 1.2.3 to 1.3.0."
          #   "Bumps [pkg](url) from a1b2c3 to d4e5f6."   (SHA-pinned actions)
          #   "Updates [pkg](url) to 2.0.0."              (no FROM baseline)
          #
          # Decision matrix:
          #   FROM present + both semver + MAJOR differs       -> REJECT (major bump)
          #   FROM present + both semver + MAJOR same          -> allow (patch/minor/pre-release)
          #   FROM present + TO non-semver (or FROM non-semver)-> allow (SHA pin; trust dependabot.yml)
          #   FROM absent + TO semver                          -> REJECT (no baseline to verify)
          #   FROM absent + TO non-semver                      -> allow (cannot parse target)
          #
          # The last case (no FROM) is the strict version of the v1 behavior, which
          # silently defaulted FROM_MAJOR to TO_MAJOR — letting major bumps through.
          # Defense in depth on top of .github/dependabot.yml's
          # `version-update:semver-major` ignore rule, which already prevents
          # majors at PR-creation time.
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq -r '.body')
          echo "PR body excerpt:"
          echo "$BODY" | head -60

          semver_major() {
            # Extract MAJOR from a semver-like token. Handles 'v' prefix and
            # pre-release suffixes; strips trailing punctuation.
            local v
            v=$(printf '%s' "$1" | sed -E 's/[.,;)]+$//')
            v=$(printf '%s' "$v" | grep -oE '^[vV]?[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            [ -z "$v" ] && return 1
            v=${v#[vV]}
            echo "${v%%.*}"
            return 0
          }

          MAJOR_BUMP=0
          UNKNOWN_BASELINE=0
          while IFS= read -r line; do
            case "$line" in
              *"from "*" to "*) ;;
              *" to "*) ;;
              *) continue ;;
            esac
            FROM=$(printf '%s\n' "$line" | sed -nE 's/.*from ([^ ]+).*/\1/p' || true)
            FROM=$(printf '%s' "$FROM" | sed -E 's/[.,;)]+$//' || true)
            TO=$(printf '%s\n' "$line" | sed -nE 's/.* to ([^ ]+).*/\1/p' || true)
            TO=$(printf '%s' "$TO" | sed -E 's/[.,;)]+$//' || true)
            [ -z "$TO" ] && continue
            TO_MAJOR=$(semver_major "$TO" || true)
            # If the target is not parseable (e.g. SHA pin), we can't decide
            # from this line; trust .github/dependabot.yml.
            [ -z "$TO_MAJOR" ] && continue

            if [ -z "$FROM" ]; then
              # "Updates X to Y" without "from" - no baseline to compare.
              echo "::error::Updates line lacks 'from' baseline; cannot verify non-major bump: $line"
              UNKNOWN_BASELINE=1
              continue
            fi

            FROM_MAJOR=$(semver_major "$FROM" || true)
            if [ -z "$FROM_MAJOR" ]; then
              # FROM is non-semver (SHA pin). Trust dependabot.yml for this line.
              continue
            fi

            if [ "$FROM_MAJOR" != "$TO_MAJOR" ]; then
              echo "::error::Major bump detected: '$FROM' -> '$TO'"
              MAJOR_BUMP=1
            fi
          done <<< "$BODY"

          if [ "$MAJOR_BUMP" -ne 0 ]; then
            echo "Refusing to auto-merge: at least one dependency bump is a major version change."
            exit 1
          fi
          if [ "$UNKNOWN_BASELINE" -ne 0 ]; then
            echo "Refusing to auto-merge: at least one update line lacks a 'from' baseline."
            echo "Open the PR, verify the bumps manually, and re-enable auto-merge if appropriate."
            exit 1
          fi
          echo "All dependency bumps are patch or minor."

      - name: Wait for all status checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "Waiting up to 30 minutes for status checks to complete..."
          # gh pr checks --watch blocks until completion and exits non-zero on failure.
          gh pr checks "$PR_NUMBER" --watch --interval 15

      - name: Verify merge state is clean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq -r '.mergeStateStatus')
          echo "mergeStateStatus: $STATE"
          if [ "$STATE" != "CLEAN" ]; then
            echo "::error::mergeStateStatus is '$STATE'; expected 'CLEAN' (no conflicts, not behind, all checks passed)."
            exit 1
          fi

      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          echo "Auto-merge enabled. GitHub will merge once branch protection conditions are met (if configured)."
